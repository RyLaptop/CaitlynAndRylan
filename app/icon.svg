<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- soft cream-pink background -->
  <rect width="32" height="32" rx="8" fill="#fff0f5"/>

  <!-- heart (adapted from site's heart-solid.svg, scaled to 28×24 with 2px padding) -->
  <path d="M16 27 C4.3 18.4 3.4 11.3 7.8 7.7 C11.3 4.9 15.5 6.5 16 10.6 C16.5 6.5 20.7 4.9 24.2 7.7 C28.6 11.3 27.7 18.4 16 27 Z"
    fill="#ffb7c5" stroke="#e8899a" stroke-width="0.8" stroke-linejoin="round"/>

  <!-- gloss highlight (matches heart-solid.svg style) -->
  <ellipse cx="11.5" cy="11" rx="2.2" ry="1.5" fill="#fff" opacity="0.55" transform="rotate(-25 11.5 11)"/>

  <!-- tiny sparkle star (top-right, golden) -->
  <path d="M25 6 C25.4 7.6 25.4 7.6 27 8 C25.4 8.4 25.4 8.4 25 10 C24.6 8.4 24.6 8.4 23 8 C24.6 7.6 24.6 7.6 25 6 Z" fill="#f0c869"/>

  <!-- tiny dot sparkle -->
  <circle cx="22" cy="5.5" r="0.9" fill="#f0c869" opacity="0.8"/>
</svg>
